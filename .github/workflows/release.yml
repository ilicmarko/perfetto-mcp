name: Release

# Releases are cut automatically when a commit lands on `main` whose
# Cargo.toml version has not been released yet. Bump `version` in Cargo.toml
# and add a `### [X.Y.Z]` section to CHANGELOG.md in the PR; merging it ships
# the GitHub release (binaries + SHA256SUMS), the npm packages, and, when
# their secrets are configured, the crates.io crate (CARGO_REGISTRY_TOKEN) and
# the Homebrew formula in ilicmarko/homebrew-tap (HOMEBREW_TAP_TOKEN).
# Every step is idempotent, so re-running (or `workflow_dispatch`) after a
# partial failure only fills in what is missing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release_exists: ${{ steps.plan.outputs.release_exists }}
      npm_published: ${{ steps.plan.outputs.npm_published }}
      crate_pending: ${{ steps.plan.outputs.crate_pending }}
      brew_pending: ${{ steps.plan.outputs.brew_pending }}
      should_release: ${{ steps.plan.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        name: Compare Cargo.toml version with releases
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CRATES_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
          HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          CRATE=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)
          TAG="v$VERSION"
          NPM_NAME=$(node -p "require('./npm/perfetto-mcp/package.json').name")
          release_exists=false
          npm_published=false
          gh release view "$TAG" >/dev/null 2>&1 && release_exists=true
          npm view "$NPM_NAME@$VERSION" version >/dev/null 2>&1 && npm_published=true
          # crates.io and Homebrew are opt-in: without their secret they never
          # count as pending, so a missing secret can't trigger a rebuild on
          # every push.
          crate_pending=false
          if [ "$HAS_CRATES_TOKEN" = true ] && ! curl -sf -A "$CRATE-release (github.com/$GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/$CRATE/$VERSION" >/dev/null; then
            crate_pending=true
          fi
          brew_pending=false
          if [ "$HAS_TAP_TOKEN" = true ] && ! curl -sf \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY_OWNER/homebrew-tap/HEAD/Formula/perfetto-mcp.rb" \
              | grep -qF "version \"$VERSION\""; then
            brew_pending=true
          fi
          should_release=true
          if [ "$release_exists" = true ] && [ "$npm_published" = true ] \
              && [ "$crate_pending" = false ] && [ "$brew_pending" = false ]; then
            should_release=false
            echo "::notice::$TAG is already released everywhere; nothing to do."
          fi
          if [ "$should_release" = true ] && ! grep -qF "### [$VERSION]" CHANGELOG.md; then
            echo "::error::Cargo.toml is at $VERSION but CHANGELOG.md has no '### [$VERSION]' section."
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "release_exists=$release_exists"
            echo "npm_published=$npm_published"
            echo "crate_pending=$crate_pending"
            echo "brew_pending=$brew_pending"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION release_exists=$release_exists npm_published=$npm_published crate_pending=$crate_pending brew_pending=$brew_pending should_release=$should_release"

  ci:
    name: CI gate
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.asset_name }}
    needs: [plan, ci]
    # Once the GitHub release exists its assets are the source of truth;
    # retries reuse them instead of rebuilding from a newer commit.
    if: needs.plan.outputs.release_exists != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: perfetto-mcp-linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset_name: perfetto-mcp-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: perfetto-mcp-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: perfetto-mcp-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: perfetto-mcp-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install protobuf
          else
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc --yes --no-progress

      - name: Install musl-tools (musl targets only)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Don't cache `~/.cargo/bin/`: a corrupted cached `cargo` survives
          # forever because failed builds skip saving a replacement.
          cache-bin: false

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/perfetto-mcp"
          if [ "${{ runner.os }}" = "Windows" ]; then
            src="${src}.exe"
          fi
          mkdir -p dist
          cp "$src" "dist/${{ matrix.asset_name }}"

      - name: Check embedded version
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          got=$("dist/${{ matrix.asset_name }}" --version)
          echo "$got"
          [ "$got" = "perfetto-mcp ${{ needs.plan.outputs.version }}" ]

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [plan, build]
    if: needs.plan.outputs.release_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compute SHA256SUMS
        working-directory: dist
        run: sha256sum perfetto-mcp-* | tee SHA256SUMS

      - name: Extract CHANGELOG section
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # Section spans from "### [VERSION]" up to the next "### [" heading.
          HEADINGS=$(grep -n '^### \[' CHANGELOG.md)
          START=$(echo "$HEADINGS" | grep -F "### [$VERSION]" | head -1 | cut -d: -f1)
          END=$(echo "$HEADINGS" | awk -F: -v s="$START" '$1 > s { print $1 - 1; exit }')
          [ -z "$END" ] && END=$(wc -l < CHANGELOG.md)
          sed -n "${START},${END}p" CHANGELOG.md > release-notes.md
          echo "Extracted lines $START..$END for $VERSION"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md

  npm:
    name: Stage npm packages
    needs: [plan, github-release]
    # Stages from the release assets, so a re-run after a partial failure
    # ships exactly the binaries attached to the GitHub release. Staged
    # versions go live only after a maintainer approves them on npmjs.com.
    if: >-
      always() &&
      needs.plan.outputs.npm_published != 'true' &&
      (needs.github-release.result == 'success' || needs.plan.outputs.release_exists == 'true')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC)
    steps:
      # Packaging scripts come from this run's commit; the binaries come from
      # the release, so a retry can pick up packaging fixes made after the tag.
      - uses: actions/checkout@v7

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'perfetto-mcp-*' --pattern SHA256SUMS
          (cd dist && if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi)

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm >= 11.15 (staged publishing)
        run: npm install -g npm@latest

      - name: Build npm packages
        run: node npm/scripts/build-packages.mjs --artifacts dist --out npm-dist --version "${{ needs.plan.outputs.version }}"

      - name: Smoke test packed packages (linux-x64)
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./npm/perfetto-mcp/package.json').name")
          mkdir -p tgz smoke
          for d in npm-dist/*/; do (cd "$d" && npm pack --pack-destination "$GITHUB_WORKSPACE/tgz" >/dev/null); done
          cd smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund "../tgz/$NAME-$VERSION.tgz" "../tgz/$(node -p "require('../npm-dist/$NAME/package.json').binaryPackages['linux-x64'].replace(/^@/, '').replace('/', '-')")-$VERSION.tgz"
          got=$(npx --no-install "$NAME" --version)
          echo "$got"
          [ "$got" = "perfetto-mcp $VERSION" ]

      # Authenticates through the trusted publisher configured on each npm
      # package (OIDC, no token). Approve the staged versions with 2FA on
      # npmjs.com or with `npm stage approve`; platform packages first.
      - name: Stage (platform packages first, then main)
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          MAIN=$(node -p "require('./npm/perfetto-mcp/package.json').name")
          stage() {
            local dir=$1 name out
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$name@$VERSION already published; skipping"
              return
            fi
            if out=$(cd "$dir" && npm stage publish --access public --provenance 2>&1); then
              echo "$out"
              echo "::notice::$name@$VERSION staged; approve it on npmjs.com"
            elif grep -qiE 'already (exists|staged)|cannot publish over|E409' <<<"$out"; then
              echo "::notice::$name@$VERSION is already staged; waiting for approval"
            else
              echo "$out" >&2
              return 1
            fi
          }
          for dir in npm-dist/*/; do
            dir=${dir%/}
            [ "$(node -p "require('./$dir/package.json').name")" = "$MAIN" ] && continue
            stage "$dir"
          done
          stage "npm-dist/${MAIN/\//__}"

  crates:
    name: Publish to crates.io
    needs: [plan, github-release]
    if: >-
      always() &&
      needs.plan.outputs.crate_pending == 'true' &&
      (needs.github-release.result == 'success' || needs.plan.outputs.release_exists == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-crate
          cache-bin: false

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  homebrew:
    name: Update Homebrew tap
    needs: [plan, github-release]
    # Formula URLs and checksums come from the GitHub release assets.
    if: >-
      always() &&
      needs.plan.outputs.brew_pending == 'true' &&
      (needs.github-release.result == 'success' || needs.plan.outputs.release_exists == 'true')
    runs-on: macos-latest
    steps:
      # Packaging scripts come from this run's commit; the binaries come from
      # the release, so a retry can pick up packaging fixes made after the tag.
      - uses: actions/checkout@v7

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'perfetto-mcp-*' --pattern SHA256SUMS
          (cd dist && if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi)

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render formula
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p tap/Formula
          node .github/scripts/render-homebrew-formula.mjs \
            --version "$VERSION" --sums dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            > tap/Formula/perfetto-mcp.rb
          ruby -c tap/Formula/perfetto-mcp.rb

      - name: Commit and push
        working-directory: tap
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/perfetto-mcp.rb
          if git diff --cached --quiet; then
            echo "::notice::Formula already at v$VERSION"
            exit 0
          fi
          git commit -m "perfetto-mcp $VERSION"
          git push

      - name: Verify brew install
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          brew tap "$GITHUB_REPOSITORY_OWNER/tap"
          brew install "$GITHUB_REPOSITORY_OWNER/tap/perfetto-mcp"
          brew test "$GITHUB_REPOSITORY_OWNER/tap/perfetto-mcp"
