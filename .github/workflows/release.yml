name: Release

# Releases are cut automatically when a commit lands on `main` whose
# Cargo.toml version has not been released yet. Bump `version` in Cargo.toml
# and add a `### [X.Y.Z]` section to CHANGELOG.md in the PR; merging it ships
# the GitHub release (binaries + SHA256SUMS) and the npm packages.
# Every step is idempotent, so re-running (or `workflow_dispatch`) after a
# partial failure only fills in what is missing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release_exists: ${{ steps.plan.outputs.release_exists }}
      npm_published: ${{ steps.plan.outputs.npm_published }}
      should_release: ${{ steps.plan.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6

      - id: plan
        name: Compare Cargo.toml version with releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          TAG="v$VERSION"
          NPM_NAME=$(node -p "require('./npm/perfetto-mcp/package.json').name")
          release_exists=false
          npm_published=false
          gh release view "$TAG" >/dev/null 2>&1 && release_exists=true
          npm view "$NPM_NAME@$VERSION" version >/dev/null 2>&1 && npm_published=true
          should_release=true
          if [ "$release_exists" = true ] && [ "$npm_published" = true ]; then
            should_release=false
            echo "::notice::$TAG is already released on GitHub and npm; nothing to do."
          fi
          if [ "$should_release" = true ] && ! grep -qF "### [$VERSION]" CHANGELOG.md; then
            echo "::error::Cargo.toml is at $VERSION but CHANGELOG.md has no '### [$VERSION]' section."
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "release_exists=$release_exists"
            echo "npm_published=$npm_published"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION release_exists=$release_exists npm_published=$npm_published should_release=$should_release"

  ci:
    name: CI gate
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.asset_name }}
    needs: [plan, ci]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: perfetto-mcp-rs-linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset_name: perfetto-mcp-rs-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            asset_name: perfetto-mcp-rs-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-14
            asset_name: perfetto-mcp-rs-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: perfetto-mcp-rs-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install protoc (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install protobuf
          else
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc --yes --no-progress

      - name: Install musl-tools (musl targets only)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Don't cache `~/.cargo/bin/`: a corrupted cached `cargo` survives
          # forever because failed builds skip saving a replacement.
          cache-bin: false

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/perfetto-mcp-rs"
          if [ "${{ runner.os }}" = "Windows" ]; then
            src="${src}.exe"
          fi
          mkdir -p dist
          cp "$src" "dist/${{ matrix.asset_name }}"

      - name: Check embedded version
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          got=$("dist/${{ matrix.asset_name }}" --version)
          echo "$got"
          [ "$got" = "perfetto-mcp-rs ${{ needs.plan.outputs.version }}" ]

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [plan, build]
    if: needs.plan.outputs.release_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute SHA256SUMS
        working-directory: dist
        run: sha256sum perfetto-mcp-rs-* | tee SHA256SUMS

      - name: Extract CHANGELOG section
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # Section spans from "### [VERSION]" up to the next "### [" heading.
          HEADINGS=$(grep -n '^### \[' CHANGELOG.md)
          START=$(echo "$HEADINGS" | grep -F "### [$VERSION]" | head -1 | cut -d: -f1)
          END=$(echo "$HEADINGS" | awk -F: -v s="$START" '$1 > s { print $1 - 1; exit }')
          [ -z "$END" ] && END=$(wc -l < CHANGELOG.md)
          sed -n "${START},${END}p" CHANGELOG.md > release-notes.md
          echo "Extracted lines $START..$END for $VERSION"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md

  npm:
    name: Publish to npm
    needs: [plan, build, github-release]
    # Run after the GitHub release, but also when it was skipped because the
    # release already existed (re-run after an npm-only failure).
    if: >-
      always() &&
      needs.plan.outputs.npm_published != 'true' &&
      needs.build.result == 'success' &&
      (needs.github-release.result == 'success' || needs.github-release.result == 'skipped')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write   # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm >= 11.5 (trusted publishing support)
        run: npm install -g npm@latest

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build npm packages
        run: node npm/scripts/build-packages.mjs --artifacts dist --out npm-dist --version "${{ needs.plan.outputs.version }}"

      - name: Smoke test packed packages (linux-x64)
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./npm/perfetto-mcp/package.json').name")
          mkdir -p tgz smoke
          for d in npm-dist/*/; do (cd "$d" && npm pack --pack-destination "$GITHUB_WORKSPACE/tgz" >/dev/null); done
          cd smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund "../tgz/$NAME-$VERSION.tgz" "../tgz/$NAME-linux-x64-$VERSION.tgz"
          got=$(npx --no-install "$NAME" --version)
          echo "$got"
          [ "$got" = "perfetto-mcp-rs $VERSION" ]

      - name: Publish (platform packages first, then main)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          MAIN=$(node -p "require('./npm/perfetto-mcp/package.json').name")
          publish() {
            local dir=$1 name
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$name@$VERSION already published; skipping"
              return
            fi
            (cd "$dir" && npm publish --access public --provenance)
          }
          for dir in npm-dist/*/; do
            dir=${dir%/}
            [ "$(node -p "require('./$dir/package.json').name")" = "$MAIN" ] && continue
            publish "$dir"
          done
          publish "npm-dist/${MAIN/\//__}"
